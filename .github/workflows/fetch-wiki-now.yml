name: Fetch Wikipedia Simplified

on:
  workflow_dispatch:

jobs:
  fetch-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      
      - name: Fetch Chinese Wikipedia simplified articles
        run: |
          # 定义要抓取的词条（格式：中文名|英文文件名）
          ARTICLES="黑洞|black_hole,宇宙大爆炸|big_bang,暗物质|dark_matter,量子力学|quantum_mechanics"
          
          mkdir -p wiki_pages
          
          # 遍历抓取，强制使用 zh-cn (简体中文)
          for entry in $(echo $ARTICLES | tr "," "\n"); do
            CN_NAME=$(echo $entry | cut -d'|' -f1)
            FILE_NAME=$(echo $entry | cut -d'|' -f2)
            echo "正在抓取简体版: $CN_NAME"
            curl -s "https://zh.wikipedia.org/api/rest_v1/page/html/${CN_NAME}?variant=zh-cn" > "wiki_pages/${FILE_NAME}.html"
          done
          
          # 使用 Pandoc 生成 EPUB，并自动生成目录
          pandoc wiki_pages/*.html -o wiki_articles.epub \
            --metadata title="维基百科科学词条(简体版)" \
            --toc \
            --toc-depth=2
          
      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          # 【关键修复】：使用单引号包裹日期格式，防止 YAML 解析错误
          msg["Subject"] = "维基百科科学词条(简体版) " + datetime.now().strftime("%Y-%m-%d")
          
          with open("wiki_articles.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="wiki_articles.epub")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ 维基百科简体版文章已成功发送到 Kindle！")
          '

name: Fetch Wikipedia Simplified

on:
  workflow_dispatch:

jobs:
  fetch-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install opencc-python-reimplemented
      
      - name: Fetch and Convert to Simplified
        run: |
          # 【极简版】：以后想加什么词条，直接用中文逗号隔开写在这里就行！
          ARTICLES="东北二王"
          
          mkdir -p wiki_pages
          
          # 1. 遍历抓取，强制使用 zh-cn (简体中文)
          for article in $(echo $ARTICLES | tr "," "\n"); do
            echo "正在抓取: $article"
            curl -s "https://zh.wikipedia.org/api/rest_v1/page/html/${article}?variant=zh-cn" > "wiki_pages/${article}.html"
          done
          
          # 2. 使用 opencc 对所有下载的 HTML 进行繁体转简体清洗
          echo "正在执行繁简转换清洗..."
          python3 -c '
          import os
          from opencc import OpenCC
          cc = OpenCC("t2s")
          folder = "wiki_pages"
          for filename in os.listdir(folder):
              if filename.endswith(".html"):
                  filepath = os.path.join(folder, filename)
                  with open(filepath, "r", encoding="utf-8") as f:
                      content = f.read()
                  simplified_content = cc.convert(content)
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(simplified_content)
          print("✅ 所有页面已转换为简体中文")
          '
          
          # 3. 使用 Pandoc 生成 EPUB，文件名带日期（▶️ 改动1）
          DATE_TAG=$(date +"%Y-%m-%d")
          pandoc wiki_pages/*.html -o "wiki_articles_${DATE_TAG}.epub" \
            --metadata title="维基百科科学词条(简体版)" \
            --toc \
            --toc-depth=2
          
      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          # ▶️ 改动2：邮件主题和附件名都带日期
          date_str = datetime.now().strftime("%Y-%m-%d")
          filename = f"wiki_articles_{date_str}.epub"
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = f"维基百科科学词条(简体版) {date_str}"
          
          with open(filename, "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename=filename)
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print(f"✅ 维基百科简体版文章 ({filename}) 已成功发送到 Kindle！")
          '
name: Fetch NASA Full Articles

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4 lxml

      - name: Fetch NASA full articles
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from datetime import datetime
          import time

          rss_url = "https://www.nasa.gov/news-release/feed/"
          feed = feedparser.parse(rss_url)
          print(f"RSS 抓到 {len(feed.entries)} 篇文章")

          html_content = f"""
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <title>NASA宇宙新闻</title>
          </head>
          <body>
          <h1>NASA 宇宙新闻</h1>
          <p>更新时间: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}</p>
          <hr>
          """

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          for entry in feed.entries[:5]:
              title = entry.get('title', '无标题')
              link = entry.get('link', '')
              print(f"抓取：{title[:35]}")

              try:
                  resp = requests.get(link, headers=headers, timeout=25)
                  resp.encoding = "utf-8"
                  soup = BeautifulSoup(resp.text, "lxml")
                  content = soup.find("article") or soup.find("div", class_="entry-content") or soup.find("main")

                  if content:
                      for bad in content(["script","style","nav","footer","aside","header"]):
                          bad.decompose()
                      text = content.get_text("\n\n", strip=True)
                      if len(text) > 5500:
                          text = text[:5500] + "\n\n【内容过长已截断】"
                      html_content += f"<h2>{title}</h2><div>{text}</div><hr>"
                  else:
                      html_content += f"<h2>{title}</h2><p>正文抓取失败</p><hr>"
                  time.sleep(1.2)
              except Exception as e:
                  print("抓取异常：",e)
                  html_content += f"<h2>{title}</h2><p>网络抓取失败</p><hr>"

          html_content += "</body></html>"
          with open("nasa_news.html","w",encoding="utf-8") as f:
              f.write(html_content)
          print("✅ HTML 生成完毕")
          EOF

      - name: Install pandoc
        run: sudo apt update && sudo apt install -y pandoc

      # 改用 MOBI 格式，Kindle 原生最兼容
      - name: Convert HTML to MOBI
        run: |
          pandoc nasa_news.html -o nasa_news.mobi \
            --metadata title="NASA每日新闻" \
            --toc --toc-depth=2

      - name: Push To Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 << 'PYEOF'
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.application import MIMEApplication
          from datetime import datetime

          msg = MIMEMultipart()
          sender = os.environ["FROM"]
          receiver = os.environ["TO"]
          msg["From"] = sender
          msg["To"] = receiver
          # Kindle 推送最简主题，不要多余符号
          msg["Subject"] = f"NASA News {datetime.now().strftime('%m-%d')}"

          # 挂载MOBI附件
          with open("nasa_news.mobi","rb") as f:
              attach = MIMEApplication(f.read(),_subtype="x-mobipocket-ebook")
              attach.add_header("Content-Disposition","attachment",filename="NASA_News.mobi")
              msg.attach(attach)

          # 稳定SSL发信
          try:
              server = smtplib.SMTP_SSL(os.environ["SMTP"],int(os.environ["PORT"]))
              server.login(sender,os.environ["SECRET"])
              server.sendmail(sender,receiver,msg.as_string())
              server.quit()
              print("🎉 推送邮件发送成功，请查Kindle")
          except Exception as err:
              print("❌ 发信失败：",err)
              exit(1)
          PYEOF

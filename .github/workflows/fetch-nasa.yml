name: Fetch NASA Chinese News

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch NASA Chinese articles
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          from datetime import datetime

          # 使用 RSSHub 的 NASA 中文源
          rss_url = "https://rsshub.app/nasa"
          
          feed = feedparser.parse(rss_url)
          print(f"RSS 抓到 {len(feed.entries)} 篇文章")

          html = f"""<!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>NASA 宇宙新闻</title></head>
          <body>
          <h1>NASA 宇宙新闻</h1>
          <p>生成时间: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}</p>
          <hr/>
          """

          for entry in feed.entries[:8]:
              title = entry.get('title', '无标题')
              link = entry.get('link', '')
              summary = entry.get('summary', entry.get('description', ''))
              
              html += f"""
              <h2>{title}</h2>
              <p><a href="{link}">原文链接</a></p>
              <div>{summary}</div>
              <hr/>
              """
              print(f"已添加: {title[:40]}...")

          html += "</body></html>"

          with open("nasa.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("HTML 生成完成")
          EOF

      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = "NASA宇宙新闻 " + datetime.now().strftime("%Y-%m-%d")
          
          with open("nasa.html", "rb") as f:
              part = MIMEBase("text", "html")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="nasa.html")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ NASA 中文新闻已发送")
          '          
          with open("nasa.html", "rb") as f:
              part = MIMEBase("text", "html")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="nasa.html")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ NASA 文章已发送")
          '
          msg = MIMEMultipart()
          sender = os.environ["FROM"]
          receiver = os.environ["TO"]
          msg["From"] = sender
          msg["To"] = receiver
          # Kindle 推送最简主题，不要多余符号
          msg["Subject"] = f"NASA News {datetime.now().strftime('%m-%d')}"

          # 挂载MOBI附件
          with open("nasa_news.mobi","rb") as f:
              attach = MIMEApplication(f.read(),_subtype="x-mobipocket-ebook")
              attach.add_header("Content-Disposition","attachment",filename="NASA_News.mobi")
              msg.attach(attach)

          # 稳定SSL发信
          try:
              server = smtplib.SMTP_SSL(os.environ["SMTP"],int(os.environ["PORT"]))
              server.login(sender,os.environ["SECRET"])
              server.sendmail(sender,receiver,msg.as_string())
              server.quit()
              print("🎉 推送邮件发送成功，请查Kindle")
          except Exception as err:
              print("❌ 发信失败：",err)
              exit(1)
          PYEOF

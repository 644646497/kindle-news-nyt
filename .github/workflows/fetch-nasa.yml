name: Fetch NASA Full Articles

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4 html2text

      - name: Fetch NASA full articles
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from datetime import datetime
          import time

          rss_url = "https://www.nasa.gov/news-release/feed/"

          feed = feedparser.parse(rss_url)
          print(f"RSS 抓到 {len(feed.entries)} 篇文章")

          html_content = f"""
          <html>
          <head><meta charset="UTF-8"><title>NASA 宇宙新闻</title></head>
          <body>
          <h1>NASA 宇宙新闻（全文）</h1>
          <p>生成时间: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}</p>
          """

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          }

          for i, entry in enumerate(feed.entries[:5]):  # 控制体积
              title = entry.get('title', '无标题')
              link = entry.get('link', '')

              print(f"抓取: {title[:40]}...")

              try:
                  resp = requests.get(link, headers=headers, timeout=30)
                  soup = BeautifulSoup(resp.text, 'html.parser')

                  content = (
                      soup.find('article')
                      or soup.find('div', class_='entry-content')
                      or soup.find('main')
                  )

                  if content:
                      for tag in content(['script','style','nav','footer','aside']):
                          tag.decompose()

                      text = content.get_text("\n", strip=True)

                      if len(text) > 6000:
                          text = text[:6000] + "\n\n[内容已截断]"

                      html_content += f"<h2>{title}</h2><p>{text}</p><hr/>"
                      print("  ✔ 成功")
                  else:
                      html_content += f"<h2>{title}</h2><p>无法提取正文</p>"
                      print("  ⚠ 未找到正文")

                  time.sleep(1)

              except Exception as e:
                  print("  ❌ 错误:", e)
                  html_content += f"<h2>{title}</h2><p>抓取失败</p>"

          html_content += "</body></html>"

          with open("nasa_articles.html", "w", encoding="utf-8") as f:
              f.write(html_content)

          print("HTML完成")
          EOF

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert to PDF
        run: |
          pandoc nasa_articles.html -o nasa_articles.pdf \
            --metadata title="NASA宇宙新闻" \
            --toc

      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}

        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime

          try:
              msg = MIMEMultipart()
              msg["From"] = os.environ["FROM"]
              msg["To"] = os.environ["TO"]
              msg["Subject"] = "NASA宇宙新闻 " + datetime.now().strftime("%Y-%m-%d")

              with open("nasa_articles.pdf", "rb") as f:
                  part = MIMEBase("application", "pdf")
                  part.set_payload(f.read())
                  encoders.encode_base64(part)
                  part.add_header("Content-Disposition", "attachment", filename="nasa.pdf")
                  msg.attach(part)

              with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
                  server.login(os.environ["FROM"], os.environ["SECRET"])
                  server.send_message(msg)

              print("✅ NASA 已发送")

          except Exception as e:
              print("❌ SMTP失败:", e)
              raise
          '

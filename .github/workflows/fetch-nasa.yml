name: Fetch NASA Full Articles

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4

      - name: Fetch NASA full articles
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from datetime import datetime
          import time

          rss_url = "https://www.nasa.gov/news-release/feed/"

          feed = feedparser.parse(rss_url)
          print(f"RSS 抓到 {len(feed.entries)} 篇文章")

          # 生成简单的 HTML 文件（无目录）
          html = f"""<!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>NASA宇宙新闻</title></head>
          <body>
          <h1>NASA宇宙新闻</h1>
          <p>生成时间: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}</p>
          <hr/>
          """

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          for i, entry in enumerate(feed.entries[:5]):
              title = entry.get('title', '无标题')
              link = entry.get('link', '')
              print(f"抓取: {title[:40]}...")

              try:
                  resp = requests.get(link, headers=headers, timeout=30)
                  soup = BeautifulSoup(resp.text, 'html.parser')

                  content = soup.find('article') or soup.find('div', class_='entry-content') or soup.find('main')

                  if content:
                      for tag in content(['script', 'style', 'nav', 'footer', 'aside']):
                          tag.decompose()
                      text = content.get_text('\n', strip=True)
                      if len(text) > 6000:
                          text = text[:6000] + "\n\n[内容已截断]"
                      html += f"<h2>{title}</h2><p>{text}</p><hr/>"
                      print("  ✔ 成功")
                  else:
                      html += f"<h2>{title}</h2><p>无法提取正文</p><hr/>"
                      print("  ⚠ 未找到正文")

                  time.sleep(1)

              except Exception as e:
                  print("  ❌ 错误:", e)
                  html += f"<h2>{title}</h2><p>抓取失败</p><hr/>"

          html += "</body></html>"

          with open("nasa.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("HTML 生成完成")
          EOF

      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = "NASA宇宙新闻 " + datetime.now().strftime("%Y-%m-%d")
          
          with open("nasa.html", "rb") as f:
              part = MIMEBase("text", "html")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="nasa.html")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ NASA 文章已发送")
          '
          msg = MIMEMultipart()
          sender = os.environ["FROM"]
          receiver = os.environ["TO"]
          msg["From"] = sender
          msg["To"] = receiver
          # Kindle 推送最简主题，不要多余符号
          msg["Subject"] = f"NASA News {datetime.now().strftime('%m-%d')}"

          # 挂载MOBI附件
          with open("nasa_news.mobi","rb") as f:
              attach = MIMEApplication(f.read(),_subtype="x-mobipocket-ebook")
              attach.add_header("Content-Disposition","attachment",filename="NASA_News.mobi")
              msg.attach(attach)

          # 稳定SSL发信
          try:
              server = smtplib.SMTP_SSL(os.environ["SMTP"],int(os.environ["PORT"]))
              server.login(sender,os.environ["SECRET"])
              server.sendmail(sender,receiver,msg.as_string())
              server.quit()
              print("🎉 推送邮件发送成功，请查Kindle")
          except Exception as err:
              print("❌ 发信失败：",err)
              exit(1)
          PYEOF

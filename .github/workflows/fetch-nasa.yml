name: Fetch NASA Full Articles

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4 html2text
      
      - name: Fetch NASA full articles
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from datetime import datetime
          import time
          
          rss_url = "https://www.nasa.gov/rss/dyn/breaking_news.rss"
          
          try:
              feed = feedparser.parse(rss_url)
              print(f"RSS 抓到 {len(feed.entries)} 篇文章")
          except Exception as e:
              print(f"RSS 失败: {e}")
              exit(1)
          
          html_content = f"""
          <html>
          <head><meta charset="UTF-8"><title>NASA 宇宙新闻 (全文)</title></head>
          <body>
          <h1>NASA 宇宙新闻 (全文)</h1>
          <p>生成时间: {datetime.now().strftime("%Y-%m-%d %H:%M:%S")}</p>
          """
          
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
          
          for i, entry in enumerate(feed.entries[:6]):  # 取前6篇，避免太长
              title = entry.get('title', '无标题')
              link = entry.get('link', '')
              print(f"正在抓取: {title[:50]}...")
              
              try:
                  # 抓取文章页面
                  resp = requests.get(link, headers=headers, timeout=30)
                  soup = BeautifulSoup(resp.text, 'html.parser')
                  
                  # NASA 文章的正文区域
                  content = soup.find('div', class_='field-item even')
                  if not content:
                      content = soup.find('article')
                  if not content:
                      content = soup.find('div', class_='entry-content')
                  if not content:
                      content = soup.find('main')
                  
                  if content:
                      # 移除脚本和样式
                      for tag in content(['script', 'style', 'nav', 'header', 'footer', 'aside']):
                          tag.decompose()
                      text = content.get_text(separator='\n\n', strip=True)
                      if len(text) > 8000:
                          text = text[:8000] + "\n\n... 篇幅限制，完整内容请访问原文"
                      html_content += f"<h2>{title}</h2><hr/>{text.replace(chr(10), '<br/>')}<br/><br/>"
                      print(f"  成功: {len(text)} 字符")
                  else:
                      html_content += f"<h2>{title}</h2><hr/><p>无法提取正文</p><br/>"
                      print(f"  失败: 找不到正文")
                  
                  time.sleep(1)  # 避免请求过快
                  
              except Exception as e:
                  print(f"  错误: {e}")
                  html_content += f"<h2>{title}</h2><hr/><p>抓取失败: {e}</p><br/>"
          
          html_content += "</body></html>"
          
          with open("nasa_articles.html", "w", encoding="utf-8") as f:
              f.write(html_content)
          
          print("HTML 生成完成")
          EOF
      
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      
      - name: Convert to EPUB
        run: |
          pandoc nasa_articles.html -o nasa_articles.epub \
            --metadata title="NASA宇宙新闻" \
            --toc \
            --toc-depth=2
      
      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = "NASA宇宙新闻 " + datetime.now().strftime("%Y-%m-%d")
          
          with open("nasa_articles.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="nasa_articles.epub")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ NASA 全文已发送")
          '

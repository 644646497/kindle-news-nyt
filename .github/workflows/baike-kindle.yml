name: 抓取百度百科推送Kindle
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 搭建Python环境
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 爬取百科生成纯文本
        run: |
          python3 << 'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import time

          words = ["银河系","黑洞","火星","引力波"]
          ua = {"User-Agent":"Mozilla/5.0"}
          content = f"百度百科精选内容\n生成时间：{datetime.now()}\n================================\n\n"

          for name in words:
            url = f"https://baike.baidu.com/item/{name}"
            try:
              res = requests.get(url,headers=ua,timeout=15)
              res.encoding="utf-8"
              soup = BeautifulSoup(res.text,"html.parser")
              con = soup.find("div",class_="main-content") or soup.find("div",class_="lemma-content")
              if con:
                for s in con(["script","style","aside","footer"]):s.decompose()
                txt = con.get_text("\n\n",strip=True)
                content += f"【{name}】\n{txt}\n\n--------------------------------\n\n"
              else:
                content += f"【{name}】\n内容抓取失败\n\n"
            except:
              content += f"【{name}】\n网络抓取失败\n\n"
            time.sleep(1)
          open("baike.txt","w",encoding="utf-8").write(content)
          print("文本生成完成")
          PY

      - name: 发送TXT到Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 << 'SEND'
          import smtplib,os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          msg=MIMEMultipart()
          msg["From"]=os.environ["FROM"]
          msg["To"]=os.environ["TO"]
          # Kindle推送关键：标题留空/极简，只发附件
          msg["Subject"]=""
          with open("baike.txt","rb") as f:
            att=MIMEBase("text","plain")
            att.set_payload(f.read())
            encoders.encode_base64(att)
            att.add_header("Content-Disposition","attachment",filename="百科精选.txt")
            msg.attach(att)
          s=smtplib.SMTP_SSL(os.environ["SMTP"],int(os.environ["PORT"]))
          s.login(os.environ["FROM"],os.environ["SECRET"])
          s.send_message(msg)
          s.quit()
          print("✅ 文本推送发送完成")
          SEND

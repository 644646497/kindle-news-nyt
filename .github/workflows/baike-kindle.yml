name: 百度百科精准抓取推Kindle
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 搭建Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml

      - name: 精准抓取百科全文
        run: |
          python3 << 'PY'
          import requests
          from bs4 import BeautifulSoup
          from datetime import datetime
          import time

          # 自定义词条
          word_list = ["银河系","黑洞","火星","引力波"]
          headers = {
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
              "Referer":"https://baike.baidu.com/"
          }

          all_text = f"百度百科合集\n生成时间：{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n{'='*50}\n\n"

          for word in word_list:
              url = f"https://baike.baidu.com/item/{word}"
              print(f"正在抓取：{word}")
              try:
                  res = requests.get(url, headers=headers, timeout=20)
                  res.encoding = "utf-8"
                  soup = BeautifulSoup(res.text, "lxml")

                  # 【最新正确正文标签】
                  article = soup.select_one("div.content-wrapper") or soup.select_one("div.para-content")
                  if not article:
                      article = soup.find("div", class_="J-lemma-content")

                  # 清理垃圾标签
                  for bad in article.find_all(["script","style","sup","table","iframe","aside"]):
                      bad.decompose()

                  full_content = article.get_text("\n", strip=True)
                  # 限制长度防过大
                  if len(full_content) > 8000:
                      full_content = full_content[:8000] + "\n……内容过长截断"

                  all_text += f"【{word}】\n{full_content}\n\n{'-'*40}\n\n"
                  print(f"✅ {word} 抓取成功")
              except Exception as e:
                  all_text += f"【{word}】\n抓取失败：{str(e)}\n\n{'-'*40}\n\n"
                  print(f"❌ {word} 失败")
              time.sleep(1.5)

          with open("baike_full.txt", "w", encoding="utf-8") as f:
              f.write(all_text)
          print("✅ 完整文本生成完毕")
          PY

      - name: 发送纯文本到Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 << 'SEND'
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = ""

          with open("baike_full.txt","r",encoding="utf-8") as f:
              txt = f.read()
          part = MIMEText(txt, "plain", "utf-8")
          msg.attach(part)

          server = smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"]))
          server.login(os.environ["FROM"], os.environ["SECRET"])
          server.send_message(msg)
          server.quit()
          print("✅ 全文推送成功")
          SEND

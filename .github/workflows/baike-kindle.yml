名字: 维基百科简体抓取推Kindle
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - 名字: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - 名字: Install dependencies
        run: |
          pip install requests beautifulsoup4 opencc-python-regex

      - 名字: 抓取维基百科（自动繁转简）
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          from opencc import OpenCC
          from datetime import datetime
          import time

          # 1. 镜像站（任选一个，国内可直连）
          base = "https://zh.wiki.hancel.org/wiki/"  # 简体优先镜像
          # base = "https://chinois.jinzhao.wiki/wiki/"
          # base = "https://wikiless.org/wiki/?lang=zh"

          # 2. 你要抓的词条
          words = ["火星"]

          # 3. 繁转简转换器
          cc = OpenCC('t2s')

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          }

          all_text = f"维基百科（简体）\n生成时间：{datetime.now()}\n====================================\n\n"

          for w in words:
              url = base + w
              print("抓取：", url)
              try:
                  res = requests.get(url, headers=headers, timeout=20)
                  res.encoding = "utf-8"
                  soup = BeautifulSoup(res.text, "html.parser")

                  # 维基正文节点
                  content = soup.select_one("div.mw-parser-output")
                  if not content:
                      all_text += f"【{w}】\n未找到正文\n\n"
                      continue

                  # 清理不需要的标签
                  for bad in content.find_all(["script","style","table","sup","iframe","aside"]):
                      bad.decompose()

                  raw = content.get_text("\n", strip=True)
                  # 繁体转简体
                  text = cc.convert(raw)

                  if len(text) > 8000:
                      text = text[:8000] + "\n……（过长截断）"

                  all_text += f"【{w}】\n{text}\n\n------------------------------------\n\n"
                  print(f"✅ {w} 成功")
              except Exception as e:
                  all_text += f"【{w}】\n抓取失败：{e}\n\n------------------------------------\n\n"
                  print(f"❌ {w} 失败", e)
              time.sleep(1.5)

          with open("wiki_zhs.txt", "w", encoding="utf-8") as f:
              f.write(all_text)
          print("✅ wiki_zhs.txt 完成")
          EOF

      - name: 发送到 Kindle（纯文本）
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 << 'EOF'
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = ""  # 空标题，Kindle最稳

          with open("wiki_zhs.txt", "r", encoding="utf-8") as f:
              content = f.read()

          msg.attach(MIMEText(content, "plain", "utf-8"))

          server = smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"]))
          server.login(os.environ["FROM"], os.environ["SECRET"])
          server.send_message(msg)
          server.quit()
          print("✅ 已发送到 Kindle")
          EOF

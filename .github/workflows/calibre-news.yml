name: Send News to Kindle

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests feedparser
        
      - name: Generate HTML and send email
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          ENCRYPT: ${{ secrets.ENCRYPT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          import smtplib
          import os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime
          
          # RSS 地址
          rss_url = "https://raw.githubusercontent.com/644646497/rss/main/feed.xml"
          
          print(f"抓取 RSS: {rss_url}")
          feed = feedparser.parse(rss_url)
          print(f"找到 {len(feed.entries)} 篇文章")
          
          # 生成 HTML
          html = f"""<!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>纽约时报新闻</title></head>
          <body>
          <h1>纽约时报新闻 - {datetime.now().strftime('%Y-%m-%d %H:%M')}</h1>
          <hr/>
          """
          
          for entry in feed.entries[:10]:
              title = entry.get('title', '无标题')
              link = entry.get('link', '#')
              # 获取摘要或正文
              summary = entry.get('summary', entry.get('description', ''))
              html += f"""
              <h2><a href="{link}">{title}</a></h2>
              <div>{summary}</div>
              <hr/>
              """
          
          html += "</body></html>"
          
          # 保存 HTML 文件
          with open('news.html', 'w', encoding='utf-8') as f:
              f.write(html)
          
          # 发送邮件
          smtp_server = os.environ.get('SMTP')
          port = int(os.environ.get('PORT'))
          username = os.environ.get('FROM')
          password = os.environ.get('SECRET')
          to = os.environ.get('TO')
          
          msg = MIMEMultipart('alternative')
          msg['From'] = username
          msg['To'] = to
          msg['Subject'] = f'纽约时报新闻 - {datetime.now().strftime("%Y-%m-%d %H:%M")}'
          
          # 附件方式发送 HTML
          from email.mime.base import MIMEBase
          from email import encoders
          
          with open('news.html', 'rb') as f:
              part = MIMEBase('application', 'octet-stream')
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header('Content-Disposition', 'attachment', filename='news.html')
              msg.attach(part)
          
          with smtplib.SMTP_SSL(smtp_server, port) as server:
              server.login(username, password)
              server.send_message(msg)
          
          print(f"✅ 发送成功！共 {len(feed.entries[:10])} 篇文章")
          EOF

import datetime
from calibre.web.feeds.news import BasicNewsRecipe

class AdvancedUserRecipe(BasicNewsRecipe):
    title = '纽约时报'
    language = 'zh_CN'
    oldest_article = 1
    max_articles_per_feed = 20
    
    no_stylesheets = True
    use_embedded_content = False
    remove_javascript = True
    auto_cleanup = True
    remove_empty_feeds = True

    summary_length = 0          # 不显示摘要
    description = '纽约时报每日更新'

    def get_cover_url(self):
        return None

    feeds = [
        ('纽约时报', 'https://raw.githubusercontent.com/644646497/rss/main/feed.xml'),
    ]

    def parse_index(self):
        articles = []
        parsed = self.parse_feed(self.feeds[0][1])
        
        for i, article in enumerate(parsed.articles[:20], 1):
            articles.append({
                'title': f"{i:02d}. {article.title.strip()}",
                'url': article.url,
                'description': ''          # 清空摘要
            })
        
        return [('今日新闻目录', articles)]

import os
import datetime
from calibre.web.feeds.news import BasicNewsRecipe

class AdvancedUserRecipe(BasicNewsRecipe):
    title = '纽约时报'
    language = 'zh_CN'
    oldest_article = 1
    max_articles_per_feed = 15
    no_stylesheets = True
    use_embedded_content = False
    remove_javascript = True
    auto_cleanup = True

    # 只保留标题列表，不显示正文
    summary_length = 0
    description = '纽约时报每日精选'

    def get_cover_url(self):
        return None

    feeds = [
        ('纽约时报', 'https://raw.githubusercontent.com/644646497/rss/main/feed.xml'),
    ]

    def parse_index(self):
        # 强制只显示标题列表
        articles = []
        feed = self.feeds[0][1]
        parsed = self.parse_feed(feed)
        
        for article in parsed.articles[:15]:
            articles.append({
                'title': article.title,
                'url': article.url,
                'date': article.date,
                'description': ''   # 清空摘要
            })
        return [('今日要闻', articles)]

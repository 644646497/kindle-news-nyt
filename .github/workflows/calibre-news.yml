name: Send News to Kindle (NYTimes)

on:
  schedule:
    - cron: '0 13 * * *'    # 北京时间晚上9点（可自行修改）
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Generate EPUB and Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 << 'EOF'
          import subprocess
          import smtplib
          import os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime

          print("开始生成纽约时报 EPUB...")

          # 生成 EPUB
          try:
              result = subprocess.run([
                  'ebook-convert', 
                  'nytimes.recipe', 
                  'nytimes.epub',
                  '--output-profile', 'kindle',
                  '--title', f'纽约时报 {datetime.now().strftime("%Y-%m-%d")}',
                  '--max-recursion-depth', '2'
              ], capture_output=True, text=True, check=True)
              
              print("✅ EPUB 生成成功")
          except subprocess.CalledProcessError as e:
              print("❌ EPUB 生成失败:")
              print(e.stderr)
              exit(1)

          # 检查文件大小
          size = os.path.getsize('nytimes.epub') / 1024
          print(f"EPUB 文件大小: {size:.1f} KB")

          if size < 100:
              print("⚠️ EPUB 文件过小，可能生成失败")
              exit(1)

          # 发送邮件
          try:
              msg = MIMEMultipart()
              msg['From'] = os.environ['FROM']
              msg['To'] = os.environ['TO']
              msg['Subject'] = f'纽约时报 {datetime.now().strftime("%Y-%m-%d")}'

              with open('nytimes.epub', 'rb') as f:
                  part = MIMEBase('application', 'epub+zip')
                  part.set_payload(f.read())
                  encoders.encode_base64(part)
                  part.add_header('Content-Disposition', 'attachment', filename='nytimes.epub')
                  msg.attach(part)

              with smtplib.SMTP_SSL(os.environ['SMTP'], int(os.environ['PORT'])) as server:
                  server.login(os.environ['FROM'], os.environ['SECRET'])
                  server.send_message(msg)

              print("✅ 邮件发送成功！请检查 Kindle 设备")
          except Exception as e:
              print(f"❌ 邮件发送失败: {e}")
              import traceback
              traceback.print_exc()
          EOF

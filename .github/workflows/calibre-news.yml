name: Send News to Kindle

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests feedparser
        
      - name: Generate HTML and send email
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          ENCRYPT: ${{ secrets.ENCRYPT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 << 'EOF'
          import requests
          import feedparser
          import smtplib
          import os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          rss_url = "https://raw.githubusercontent.com/644646497/rss/main/feed.xml"
          feed = feedparser.parse(rss_url)
          
          now = datetime.now()
          date_str = now.strftime('%Y年%m月%d日 %H:%M')
          
          html = f"""<!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>纽约时报新闻 - {date_str}</title></head>
          <body>
          <div style="text-align:center; padding:40px 0; border-bottom:2px solid #ccc;">
              <h1>纽约时报新闻</h1>
              <p style="color:#666; font-size:16px;">{date_str}</p>
              <p>共 {len(feed.entries)} 篇文章</p>
          </div>
          
          <div style="margin:30px 0; padding:20px; background:#f5f5f5;">
              <h2>📑 目录</h2>
              <ul style="font-size:18px; line-height:1.8;">
          """
          
          for i, entry in enumerate(feed.entries[:15], 1):
              title = entry.get('title', '无标题')
              html += f'              <li><a href="#article{i}">{title}</a></li>\n'
          
          html += """              </ul>
          </div>
          
          <hr/>
          """
          
          for i, entry in enumerate(feed.entries[:15], 1):
              title = entry.get('title', '无标题')
              link = entry.get('link', '#')
              summary = entry.get('summary', entry.get('description', ''))
              pub_date = entry.get('published', '')
              if pub_date:
                  try:
                      dt = datetime.strptime(pub_date[:19], '%Y-%m-%d %H:%M:%S')
                      pub_date = dt.strftime('%Y-%m-%d %H:%M')
                  except:
                      pass
              else:
                  pub_date = ''
              
              # 获取作者
              author = entry.get('author', '')
              if not author and 'dc:creator' in entry:
                  author = entry.get('dc:creator', '')
              if not author:
                  author = '纽约时报'
              
              html += f"""
          <div id="article{i}" style="margin:40px 0; padding:20px; border-bottom:1px solid #eee;">
              <h2><a href="{link}" style="color:#333; text-decoration:none;">{title}</a></h2>
              <div style="color:#888; font-size:14px; margin:10px 0;">
                  📅 时间: {pub_date} &nbsp;|&nbsp; ✍️ 作者: {author}
              </div>
              <div style="color:#666; font-size:14px;">原文链接: <a href="{link}">{link}</a></div>
              <div style="margin:15px 0; line-height:1.6;">{summary}</div>
              <div style="margin-top:15px;"><a href="#top" style="color:#999;">↑ 返回顶部</a></div>
          </div>
          """
          
          html += "<div style='text-align:center; padding:40px; color:#999;'>生成时间: {}</div></body></html>".format(datetime.now().strftime('%Y-%m-%d %H:%M:%S'))
          
          with open('news.html', 'w', encoding='utf-8') as f:
              f.write(html)
          
          # 发送邮件
          smtp_server = os.environ.get('SMTP')
          port = int(os.environ.get('PORT'))
          username = os.environ.get('FROM')
          password = os.environ.get('SECRET')
          to = os.environ.get('TO')
          
          msg = MIMEMultipart()
          msg['From'] = username
          msg['To'] = to
          msg['Subject'] = f'纽约时报新闻 - {date_str}'
          
          with open('news.html', 'rb') as f:
              part = MIMEBase('application', 'octet-stream')
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header('Content-Disposition', 'attachment', filename='news.html')
              msg.attach(part)
          
          with smtplib.SMTP_SSL(smtp_server, port) as server:
              server.login(username, password)
              server.send_message(msg)
          
          print(f"✅ 发送成功！共 {len(feed.entries[:15])} 篇文章")
          EOF

name: Fetch and Send NASA News

on:
  # 允许手动触发
  workflow_dispatch:
  # 也可以设置定时触发（例如每天早上8点 UTC+8）
  # schedule:
  #   - cron: '0 0 * * *' 

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Calibre 工具
      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      # 3. 第一步：抓取 NASA 新闻，生成临时 EPUB
      - name: Generate Temp EPUB
        run: |
          ebook-convert nasa_news.recipe nasa_news_temp.epub

      # 4. 第二步：二次清洗，将临时 EPUB 转换为标准 EPUB
      # 这一步会重写 CSS、修复 HTML 标签、生成标准目录，防止被亚马逊静默拦截
      - name: Clean and Convert EPUB
        run: |
          ebook-convert nasa_news_temp.epub nasa_news.epub --epub-inline-toc --toc-title "目录"

      # 5. 发送邮件到 Kindle
      - name: Send EPUB to Kindle
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: NASA Official News (CN)
          body: "This is your daily NASA news."
          to: ${{ secrets.KINDLE_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          attachments: nasa_news.epub

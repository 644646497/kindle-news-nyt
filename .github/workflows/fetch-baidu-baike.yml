name: Fetch Baidu Baike Articles

on:
  workflow_dispatch:

jobs:
  fetch-baike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      
      - name: Fetch Baidu Baike full articles
        run: |
          ARTICLES="黑洞,宇宙大爆炸,暗物质,量子力学"
          
          mkdir -p baike_pages
          
          for article in $(echo $ARTICLES | tr "," "\n"); do
            echo "正在抓取: $article"
            curl -s -L "https://baike.baidu.com/item/${article}" > "baike_pages/${article}.html"
          done
          
          # 用 pandoc 生成 EPUB，跳过图片
          pandoc baike_pages/*.html -o baike_articles.epub \
            --metadata title="百度百科科学词条" \
            --toc \
            --toc-depth=2 \
            --extract-media=null
          
      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = f"百度百科科学词条 {datetime.now().strftime("%Y-%m-%d %H:%M")}"
          
          with open("baike_articles.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="baike_articles.epub")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ 百度百科文章已发送")
          '

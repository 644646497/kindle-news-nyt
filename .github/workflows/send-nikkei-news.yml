name: Send Nikkei News to Kindle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Build Nikkei EPUB
        run: |
          ebook-convert nikkei.recipe nikkei.epub --output-profile kindle

      - name: Send EPUB to Kindle via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "日经中文网 - ${{ github.sha }}"
          to: ${{ secrets.KINDLE_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          attachments: nikkei.epub

name: Send UDN News to Kindle

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre

      - name: Create recipe file
        run: |
          cat > udn.recipe << 'EOF'
#!/usr/bin/env python
# vim:fileencoding=utf-8
from __future__ import unicode_literals, division, absolute_import, print_function
import re
import datetime
from calibre.web.feeds.news import BasicNewsRecipe

class UdnNewsRecipe(BasicNewsRecipe):
    title = '联合新闻网 - ' + datetime.datetime.now().strftime('%Y-%m-%d')
    language = 'zh-TW'
    __author__ = 'calibre user'
    
    oldest_article = 1
    max_articles_per_feed = 20
    auto_cleanup = True
    no_stylesheets = False
    remove_javascript = True
    
    compress_news_images = True
    scale_news_images_to = 600
    
    keep_only_tags = [
        dict(name='h1'),
        dict(name='div', attrs={'class': re.compile(r'article-content|article_body|story-article')}),
        dict(name='article'),
    ]
    
    remove_tags = [
        dict(name='script'), dict(name='style'), dict(name='iframe'),
        dict(name='nav'), dict(name='header'), dict(name='footer'),
        dict(name='aside'),
        dict(name='div', attrs={'class': re.compile(r'ad|share|related|comment|sidebar', re.I)}),
    ]
    
    # 直接抓取网页（不使用 RSS）
    def parse_index(self):
        feeds = []
        sections = [
            ('即时新闻', 'https://udn.com/news/breaknews/1/1'),
            ('政治', 'https://udn.com/news/rank/political'),
            ('财经', 'https://udn.com/news/rank/finance'),
            ('科技', 'https://udn.com/news/rank/tech'),
            ('国际', 'https://udn.com/news/rank/world'),
        ]
        
        for section_name, section_url in sections:
            self.log.info('正在抓取: ' + section_name)
            try:
                soup = self.index_to_soup(section_url)
                articles = []
                
                for link in soup.find_all('a', href=re.compile(r'/news/story/')):
                    title = link.get_text(strip=True)
                    if title and len(title) > 5:
                        url = link.get('href')
                        if url.startswith('/'):
                            url = 'https://udn.com' + url
                        articles.append((section_name, title, url, '', ''))
                    if len(articles) >= self.max_articles_per_feed:
                        break
                
                if articles:
                    feeds.append((section_name, articles))
                    self.log.info('找到 ' + str(len(articles)) + ' 篇文章')
            except Exception as e:
                self.log.error('抓取失败: ' + str(e))
        
        return feeds
    
    def preprocess_html(self, soup):
        for tag in soup.find_all('div', class_=re.compile(r'ad|share|social', re.I)):
            tag.decompose()
        return soup

if __name__ == "__main__":
    from calibre.web.feeds.recipes.utils import cli
    cli(UdnNewsRecipe)
EOF
          echo "✅ recipe 文件已创建"
          cat udn.recipe | head -5

      - name: Generate and Send
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          # 测试 recipe
          echo "=== 测试 recipe ==="
          ebook-convert udn.recipe .epub --test -vv 2>&1 | head -30
          
          # 生成电子书
          ebook-convert udn.recipe udn_news.epub --output-profile kindle
          
          # 发送邮件（原有代码）
          # ... 你的发送代码 ...

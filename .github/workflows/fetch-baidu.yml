name: Fetch Baidu Baike to Kindle

on:
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install requests beautifulsoup4
      
      - name: Fetch Baidu Baike Article
        run: |
          # 运行 Python 脚本抓取“宇宙”词条
          python3 baidu_spider.py
          
          # 将抓取到的纯文本转换为 EPUB
          pandoc baidu_article.txt -o baidu_article.epub --metadata title="百度百科-宇宙"
          
      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = "百度百科-宇宙 " + datetime.now().strftime("%Y-%m-%d")
          
          with open("baidu_article.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="baidu_article.epub")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ 百度百科文章已成功发送到 Kindle！")
          '

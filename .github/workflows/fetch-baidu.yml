name: Fetch Baidu Baike to Kindle

on:
  workflow_dispatch:

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      
      - name: Fetch Baidu Baike Article
        run: |
          # 1. 使用 curl 抓取“宇宙”词条
          # 【核心】必须加上 -H 参数伪装成真实浏览器，否则会被百度百科拦截返回 403
          echo "正在抓取百度百科【宇宙】词条..."
          curl -s -L "https://baike.baidu.com/item/宇宙" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o baidu_raw.html
          
          # 2. 简单清理 HTML 标签（去除 script, style 等，保留基本文本结构）
          # 使用 sed 命令进行基础的文本清洗
          sed -e 's/<script[^>]*>.*<\/script>//g' \
              -e 's/<style[^>]*>.*<\/style>//g' \
              -e 's/<[^>]*>//g' \
              baidu_raw.html > baidu_clean.txt
          
          # 3. 使用 Pandoc 将清洗后的文本转换为 EPUB
          pandoc baidu_clean.txt -o baidu_article.epub \
            --metadata title="百度百科-宇宙" \
            --toc
          
          echo "✅ 百度百科文章已成功转换为 EPUB"
          
      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime
          
          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = "百度百科-宇宙 " + datetime.now().strftime("%Y-%m-%d")
          
          with open("baidu_article.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="baidu_article.epub")
              msg.attach(part)
          
          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ 百度百科文章已成功发送到 Kindle！")
          '

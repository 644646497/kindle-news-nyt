name: Update Nikkei RSS
# UTC 6小时执行一次，手动可触发
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update_rss:
    runs-on: ubuntu-latest
    # 任务超时限制，防止卡死
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 完整克隆仓库，解决git diff失效
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 安装系统依赖，修复opencc编译失败
      - name: Install system libopencc
        run: sudo apt update && sudo apt install -y libopencc-dev

      # Python环境
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # 缓存pip依赖加速构建

      # 安装python包
      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 opencc-python-reimplemented

      # 执行抓取脚本
      - name: Run RSS crawler
        run: python nikkei_rss.py

      # 提交并推送更新
      - name: Commit & Push RSS File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nikkei_feed.xml
          # 仅文件变更时提交
          if git diff --quiet --staged; then
            echo "RSS文件无更新，跳过提交"
          else
            git commit -m "auto update nikkei rss feed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
          fi

name: Update Nikkei RSS For Kindle
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update_rss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository (Kindle项目完整拉取)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 安装opencc编译依赖
      - name: Install opencc系统库
        run: sudo apt update && sudo apt install -y libopencc-dev

      - name: Setup Python3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装爬虫依赖包
        run: pip install requests beautifulsoup4 opencc-python-reimplemented

      # 执行你的脚本文件 nikkei.recipe
      - name: 运行爬虫生成nikkei_feed.xml
        run: python nikkei.recipe

      # 自动提交更新后的RSS文件
      - name: 推送RSS源至仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nikkei_feed.xml
          if git diff --quiet --staged; then
            echo "RSS无新内容，跳过本次提交"
          else
            git commit -m "[Auto Kindle] 自动更新日经中文RSS $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
          fi

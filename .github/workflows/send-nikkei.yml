name: Update Nikkei RSS For Kindle
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update_rss:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 安装Chrome浏览器依赖（给selenium无头渲染用）
      - name: Install Chrome & system lib
        run: |
          sudo apt update
          sudo apt install -y libopencc-dev chromium-chromedriver chromium-browser

      - name: Setup Python3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install all python dependencies
        run: pip install requests beautifulsoup4 opencc-python-reimplemented selenium

      # 配置Chrome驱动环境变量
      - name: Set chromedriver path
        run: echo "CHROME_DRIVER=/usr/lib/chromium-browser/chromedriver" >> $GITHUB_ENV

      # 执行爬虫
      - name: Run crawler
        run: python nikkei.recipe

      # 提交RSS文件
      - name: Commit & Push RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nikkei_feed.xml
          if git diff --quiet --staged; then
            echo "No new articles, skip commit"
          else
            git commit -m "[Auto Kindle] Update Nikkei RSS $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
          fi

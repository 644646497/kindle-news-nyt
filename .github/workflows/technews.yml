name: Send TechNews to Kindle

on:
  schedule:
    - cron: '0 22 * * *'  # 每天 22:00 触发
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Calibre and Dependencies
        run: |
          # 1. 安装 Calibre
          sudo apt-get update
          sudo apt-get install -y calibre
          
          # 2. 安装 Python 依赖（用于简繁转换）
          pip install opencc-python-reimplemented
          
          # 3. 确保中文字体存在（关键步骤）
          sudo apt-get install -y fonts-noto-cjk
          # 刷新字体缓存
          fc-cache -f -v

      - name: Generate and Send
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          # 使用通用的 kindle 配置文件，避免版本不兼容
          ebook-convert technews.recipe technews.epub --output-profile kindle

          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime

          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = f"科技新报 {datetime.now().strftime("%Y-%m-%d")}"

          with open("technews.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="科技新报.epub")
              msg.attach(part)

          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("发送完成")
          '

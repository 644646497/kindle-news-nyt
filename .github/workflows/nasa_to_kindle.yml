name: Send NASA Blogs to Kindle (Chinese)

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 06:00（第二天早上）
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre
          pip install deep-translator beautifulsoup4

      - name: Generate and Send
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          # 生成简体中文全文电子书
          ebook-convert nasa_blogs.recipe nasa_chinese.epub --output-profile kindle

          # 发送邮件
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime

          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          msg["Subject"] = f"NASA 博客精选 {datetime.now().strftime("%Y-%m-%d")} [简体中文]"

          with open("nasa_chinese.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="NASA博客_简体中文.epub")
              msg.attach(part)

          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("✅ 发送完成，全文简体中文")
          '

name: Send to Kindle - TechNews (科技新报)

on:
  schedule:
    - cron: '0 13 * * *'   # UTC 13:00 = 北京时间 21:00
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies & Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre
          pip install opencc-python-reimplemented

      - name: Generate and Send
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          # 1. 生成电子书
          ebook-convert taipei_astronomy.recipe technews.epub --output-profile kindle

          # 2. 发送邮件
          python3 -c '
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email import encoders
          from datetime import datetime

          msg = MIMEMultipart()
          msg["From"] = os.environ["FROM"]
          msg["To"] = os.environ["TO"]
          # 【关键修复】：将双引号改为单引号，防止破坏 YAML 语法
          msg["Subject"] = f"科技新报 {datetime.now().strftime("%Y-%m-%d")}"

          with open("technews.epub", "rb") as f:
              part = MIMEBase("application", "epub+zip")
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header("Content-Disposition", "attachment", filename="科技新报.epub")
              msg.attach(part)

          with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
              server.login(os.environ["FROM"], os.environ["SECRET"])
              server.send_message(msg)
          print("发送完成")
          '

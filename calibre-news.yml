      - name: Send to Kindle
        env:
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          SMTP: ${{ secrets.SMTP }}
          PORT: ${{ secrets.PORT }}
          SECRET: ${{ secrets.SECRET }}
        run: |
          ebook-convert nytimes.recipe news1.epub --output-profile kindle
          ebook-convert nikkei.recipe news2.epub --output-profile kindle
          # 合并或分别发送
          python3 -c '
import smtplib, os
from email.mime.multipart import MIMEMultipart
from email.mime.base import MIMEBase
from email import encoders
from datetime import datetime

msg = MIMEMultipart()
msg["From"] = os.environ["FROM"]
msg["To"] = os.environ["TO"]
msg["Subject"] = "新闻合辑 " + datetime.now().strftime("%Y-%m-%d")

for epub in ["news1.epub", "news2.epub"]:
    with open(epub, "rb") as f:
        part = MIMEBase("application", "epub+zip")
        part.set_payload(f.read())
        encoders.encode_base64(part)
        part.add_header("Content-Disposition", "attachment", filename=epub)
        msg.attach(part)

with smtplib.SMTP_SSL(os.environ["SMTP"], int(os.environ["PORT"])) as server:
    server.login(os.environ["FROM"], os.environ["SECRET"])
    server.send_message(msg)
print("发送完成")
'
